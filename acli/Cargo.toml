[package]
name = "acli"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Enable real Anki backend. Requires building outside workspace or with cargo --manifest-path
real-anki = ["anki-wrapper/real-anki"]
# Enable the `serve` subcommand (local web preview of cards)
web = ["dep:web-preview"]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
walkdir = { workspace = true }
doc-parser = { path = "../doc-parser" }
update-planner-parser = { path = "../update-planner-parser" }
anki-wrapper = { path = "../anki-wrapper", default-features = false }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true, default-features = true }
toml = "1.0.4"
serde = { workspace = true }
web-preview = { path = "../web-preview", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
