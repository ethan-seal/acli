[workspace]
members = [
    "acli",
    "doc-parser",
    "update-planner-parser",
    "web-preview",
]
exclude = [
    # Exclude anki-wrapper to avoid workspace conflict with its anki submodule
    "anki-wrapper",
]
resolver = "2"
default-members = ["acli", "doc-parser", "update-planner-parser", "web-preview"]

[workspace.package]
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
pulldown-cmark = { version = "0.9", default-features = false }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
tempfile = "3"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
