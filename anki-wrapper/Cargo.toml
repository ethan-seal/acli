[package]
name = "anki-wrapper"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Minimal wrapper trait + types for Anki operations, with a fake for testing."

[lib]
name = "anki_wrapper"
path = "src/lib.rs"

[features]
# Enable the real Anki backend when available
default = []
real-anki = ["anki", "tokio"]

[dependencies]
anki = { path = "anki/rslib", package = "anki", optional = true }
# Add tokio with io-util feature needed by anki's sync code
tokio = { version = "1.45", features = ["io-util"], optional = true }

[dev-dependencies]
maplit = "1"
anyhow = "1"

[[example]]
name = "rslib_demo"
required-features = ["real-anki"]
